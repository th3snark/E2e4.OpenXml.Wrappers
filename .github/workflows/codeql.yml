name: CodeQL

# Runs only as the first job of publish.yml, on the tagged code: nothing is scanned until a release, and a finding stops the release.
on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        id: analyze
      # The analyze step passes whatever it finds, and alerts on a tag do not show on the default branch, so list them here and fail.
      - name: Stop the release if CodeQL found anything
        env:
          SARIF_FOLDER: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' "$SARIF_FOLDER"/*.sarif
          found=$(jq -s '[.[].runs[].results[]] | length' "$SARIF_FOLDER"/*.sarif)
          echo "CodeQL found $found result(s)."
          if [ "$found" -ne 0 ]; then
            echo "::error::CodeQL found $found result(s); fix them and release from a new commit."
            exit 1
          fi
